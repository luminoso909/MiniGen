[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minigen"
version = "0.1.0"
description = "A learning-first laboratory for controllable image generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
  "matplotlib>=3.10,<4",
  "tqdm>=4.67,<5",
  "jaxtyping>=0.3,<0.4",
]

[project.optional-dependencies]
latent = [
  "diffusers>=0.33,<1",
  "huggingface-hub>=0.30,<2",
  "safetensors>=0.5,<1",
  "opencv-python-headless>=4.11,<5",
  "pypdf>=5,<7",
]
generation = [
  "diffusers>=0.33,<1",
  "transformers>=4.51,<6",
  "accelerate>=1,<2",
  "peft>=0.15,<1",
  "datasets>=3,<5",
  "huggingface-hub>=0.30,<2",
  "safetensors>=0.5,<1",
]
notebook = [
  "jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6",
  "nbclient>=0.10,<1", "nbconvert>=7,<8",
]

[project.scripts]
minigen = "minigen.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/minigen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebook setup precedes plotting imports; visual grids intentionally use zip.
"docs/learning/*.ipynb" = ["E402", "B905"]
