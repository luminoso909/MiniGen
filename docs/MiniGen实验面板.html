function renderEvaluations(){let arr=[...state.evaluations].reverse();return head('可信评测','记录配对重建指标、条件遵循、数据划分与评测协议；所有数字均为真实输入。',button('＋ 新增评测','new-eval','', 'primary'))+`<div class="lock-card"><h3>评测不等于训练损失</h3><div class="constraint-list"><span class="constraint">PSNR ↑ · 配对像素相似度</span><span class="constraint">SSIM ↑ · 结构相似度</span><span class="constraint">LPIPS ↓ · 感知距离</span><span class="constraint">条件遵循 · 固定提示词和人工抽查</span></div><p class="hint" style="margin-bottom:0">填写测试集版本、样本数、图像归一化与聚合方式。VAE 重建可用配对指标；无参考图的生成样本需另用合适的生成质量和语义指标。</p></div><section class="panel"><div class="panel-header"><h2>指标记录</h2><span class="pill">${arr.length} 条</span></div>${arr.length?`<div class="table-wrap"><table class="tbl"><thead><tr><th>日期 / 实验</th><th>协议 / 数据划分</th><th>样本数</th><th>PSNR ↑</th><th>SSIM ↑</th><th>LPIPS ↓</th><th>条件遵循</th><th>操作</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${e(x.date)}<br><span class="code">${e(x.experiment)}</span></td><td>${e(x.protocol||'未填')}<br><small class="muted">${e(x.split||'未填')}</small></td><td>${e(x.count||'—')}</td><td class="em">${f(x.psnr)}</td><td class="em">${f(x.ssim,3)}</td><td class="em">${f(x.lpips,3)}</td><td>${x.success!==''?e(x.success)+'%':'—'}</td><td>${button('编辑','edit-eval',`data-id="${e(x.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('还没有真实评测结果。添加记录时可填写样本数和协议，不必一次填满全部指标。','◎')}</section>`}
function renderReviews(){let arr=state.reviews.filter(x=>filters.reviews.status==='all'||x.status===filters.reviews.status);return head('待复核知识清单','将「代码行为、数值观测、数学推导」分别留证；待复核不代表没有学过。',button('＋ 新增知识卡','new-review','', 'primary'))+`<div class="filterbar"><select id="reviewStatus">${opts([['all','全部状态'],'待复核','正在验证','已掌握'],filters.reviews.status)}</select><span class="muted tiny">本列表由项目学习问题初始化，可按实际掌握情况修改。</span></div><div class="knowledge-grid">${arr.map(x=>`<article class="review-card"><div class="panel-header" style="margin:0"><span class="code">${e(x.category)}</span>${badge(x.status)}</div><h3>${e(x.topic)}</h3><p>${e(x.notes)}</p>${x.evidence?`<div class="note">证据：${e(x.evidence)}</div>`:''}<div class="card-actions">${button('编辑 / 复核','edit-review',`data-id="${e(x.id)}"`)}</div></article>`).join('')||empty('这一筛选下没有知识卡。')}</div>`}
function summaryStats(s){let tasks=state.tasks.filter(x=>x.stage===s),done=tasks.filter(x=>x.status==='已验证'),exps=state.experiments.filter(x=>x.stage===s),evals=state.evaluations.filter(x=>exps.some(z=>z.id===x.experiment));return {tasks,done,exps,evals}}
function renderSummaries(){let s=filters.summaries.stage,st=summaryStats(s),sum=state.summaries[s]||{};return head('阶段总结','自动汇总任务与证据，人工书写关键结论、局限性和下一阶段问题。',button('导出 Markdown','export-md'))+`<div class="filterbar"><select id="summaryStage">${opts(stages.map(x=>[x,x+' · '+STAGES[x]]),s)}</select>${button('编辑总结','edit-summary','','primary small')}</div><div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi('任务已验证',`${st.done.length} / ${st.tasks.length}`,'以验收状态为准','✓')}${kpi('关联实验',st.exps.length,'实验簿中的阶段标记','⌬')}${kpi('关联评测',st.evals.length,'绑定至该阶段实验','◎')}</div>${titleCard('阶段回顾 · '+e(STAGES[s]),'',`<div class="two-col"><div><div class="eyebrow">WHAT WE OBSERVED</div><div class="summary-text">${nl(sum.findings||'尚未撰写实际结果与关键发现。')}</div></div><div><div class="eyebrow">LIMITATIONS & NEXT</div><div class="summary-text">${nl(sum.issues||'尚未总结待解决问题。')}<hr class="divider">${nl(sum.next||'尚未写下下一阶段决策。')}</div></div></div>`)}${titleCard('验收任务快照',`<small>${st.done.length} 项已验证</small>`,st.tasks.map(x=>`<div class="stat-row"><div><strong>${e(x.id)} · ${e(x.title)}</strong><br><small>${e(x.evidence)}</small></div>${badge(x.status)}</div>`).join('')||empty('暂无任务。'))}${titleCard('关联实验',`<small>${st.exps.length} 条</small>`,st.exps.map(x=>`<div class="stat-row"><div><strong>${e(x.name)}</strong><br><small>Git ${e(x.commit||'未填')} · ${e(x.date)}</small></div>${badge(x.status)}</div>`).join('')||empty('还没有该阶段的实验记录。'))}`}
function renderSettings(){return head('备份与设置','所有文本记录保存在当前浏览器；图像保存在 IndexedDB。请定期导出完整 JSON。')+`<div class="grid equal"><section class="panel"><div class="panel-header"><h2>项目环境</h2></div><form id="settingsForm" class="form-grid"><div class="field"><label>当前阶段</label><select name="currentStage">${opts(stages,state.settings.currentStage)}</select></div><div class="field"><label>当前学习周</label><input name="currentWeek" value="${e(state.settings.currentWeek)}"></div><div class="field full"><label>仓库地址（可选）</label><input name="repo" value="${e(state.settings.repo)}" placeholder="https://github.com/..."></div><div class="field full"><label>项目状态说明</label><textarea name="memo">${e(state.settings.memo)}</textarea></div><div class="field full"><button type="submit" class="btn primary">保存项目设置</button></div></form></section><section class="panel"><div class="panel-header"><h2>数据可移植性</h2></div><p class="desc">完整备份包含任务、数据集历史、实验配置、训练曲线、评测、总结与已上传图像。可将 JSON 文件保存到项目仓库的私有目录中。</p><div class="card-actions">${button('↓ 导出完整 JSON','export','','primary') }<label class="upload" style="margin:0">↑ 导入 JSON<input type="file" id="importJSON" accept=".json,application/json"></label></div><hr class="divider"><p class="hint">此站点不连接云数据库或 GitHub，也不会读取你的本地训练目录；要同步新结果，请导入日志 / 图像或备份文件。不同浏览器之间不会自动同步。</p><div class="card-actions">${button('重置为初始项目数据','reset','','danger small')}</div></section></div><section class="panel"><div class="panel-header"><h2>实验目录建议</h2></div><pre class="code" style="line-height:2;white-space:pre-wrap">runs/&lt;exp_id&gt;/config.json\nruns/&lt;exp_id&gt;/train.csv\nruns/&lt;exp_id&gt;/samples/{original,recon,generated}/*.png\nruns/&lt;exp_id&gt;/evaluation.json\nreports/stage_S3.md</pre><p class="hint">数据集筛选的 256×256 要求属于正式训练计划；预训练 VAE 的编码尺寸或底层 latent resolution 应以真实模型配置与实测为准。</p></section>`}
function field(label,name,value='',extra='',full=false,help=''){return `<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" value="${e(value)}" ${extra}>${help?`<small>${help}</small>`:''}</div>`}
function area(label,name,value='',help=''){return `<div class="field full"><label>${label}</label><textarea name="${name}">${e(value)}</textarea>${help?`<small>${help}</small>`:''}</div>`}
function selectField(label,name,values,value){return `<div class="field"><label>${label}</label><select name="${name}">${opts(values,value)}</select></div>`}
function wrapForm(type,id,body){return `<form class="record-form" data-record="${type}" data-id="${e(id||'')}"><div class="form-grid">${body}</div><div class="form-foot"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn primary">保存记录</button></div></form>`}
function openModal(title,body){$('#modals').innerHTML=`<div class="modal-mask"><div class="modal" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="modal-head"><h2>${e(title)}</h2><button data-action="close-modal" aria-label="关闭">×</button></div>${body}</div></div>`;$('.modal input:not([type=hidden]),.modal textarea')?.focus()}
function closeModal(){$('#modals').innerHTML=''}
function editTask(id){let x=state.tasks.find(x=>x.id===id)||{id:'',stage:state.settings.currentStage,week:state.settings.currentWeek,title:'',status:'待做',evidence:'',detail:''};openModal(id?'编辑任务 · '+id:'新增阶段任务',wrapForm('task',id,field('任务编号','taskid',x.id,'required',false,'建议保持仓库文档中的 S3-xx 编号')+selectField('阶段','stage',stages,x.stage)+field('周次','week',x.week,'required')+selectField('状态','status',STATUS,x.status)+field('任务标题','title',x.title,'required',true)+area('验收证据 / 证据位置','evidence',x.evidence,'设为「已验证」之前必须提供可核对的证据')+area('当前进度、风险与说明','detail',x.detail)))}
function editDataset(id){let x=state.datasets.find(x=>x.id===id)||{name:'',version:'v1',size:'',source:'',provenance:'待核验',captions:'待审核',square:'待测量',visual_quality:'待审核',theme:'待确认',caption_coverage:'待统计',duplicate_rate:'待测量',license:'待核验',status:'待审核',split:'未划分',path:'',notes:''};openModal(id?'编辑数据集与版本':'新建数据集档案',wrapForm('dataset',id,field('数据集名称','name',x.name,'required',true)+field('数据版本','version',x.version,'required')+field('样本量','size',x.size,'type="number" min="0"')+field('来源 / URL / 发布方','source',x.source)+selectField('审核状态','status',['待审核','已选用','已排除'],x.status)+selectField('来源类型','provenance',['待核验','真实绘制/摄影','人工插画','AI 生成','混合','其他'],x.provenance)+field('原生正方形比例','square',x.square,'placeholder="如 83% / 待测量"')+field('Caption 质量','captions',x.captions,'placeholder="人工抽查精度 / 丰富度"')+field('Caption 覆盖率','caption_coverage',x.caption_coverage||'待统计')+field('图像视觉质量','visual_quality',x.visual_quality||'待审核')+field('主题统一程度','theme',x.theme||'待确认')+field('重复图率','duplicate_rate',x.duplicate_rate||'待测量')+field('许可 / 使用限制','license',x.license)+field('Train / Val / Test 划分','split',x.split)+field('存放路径 / 版本哈希','path',x.path,'',true)+area('审核意见与变更原因','notes',x.notes)))}

function editExp(id,templateName){let x=state.experiments.find(x=>x.id===id),t=EXP_TEMPLATES[templateName]||EXP_TEMPLATES['S3 CFG 基线'];x=x||{name:'',kind:t.kind,stage:state.settings.currentStage,date:today(),status:'计划中',hypothesis:t.hypothesis,commit:'',dataset:state.datasets[0]?.version||'',seed:'',config:JSON.stringify(t.config,null,2),results:'',issues:'',next:t.next,owner:'',notes:''};openModal(id?'编辑实验 · '+id:'创建实验（不会伪造运行结果）',wrapForm('exp',id,`${!id?selectField('可复用模板','template',[['','自定义实验'],...Object.keys(EXP_TEMPLATES)],templateName||''):''}${field('实验名称','name',x.name,'required',true)}${selectField('阶段','stage',stages,x.stage)}${selectField('实验类型','kind',['CFG / DiT','DDPM','DiT','VAE','Evaluation','Flow','Other'],x.kind)}${selectField('运行状态','status',['计划中','运行中','已运行·待复核','已验收','中止'],x.status)}${field('日期','date',x.date,'type="date"')}${field('Git 提交 SHA / tag','commit',x.commit)}${field('数据集版本','dataset',x.dataset)}${field('随机种子','seed',x.seed)}${area('研究假设','hypothesis',x.hypothesis)}${area('训练 / 采样配置 JSON（或结构化文本）','config',x.config,'建议记录模型、权重、优化器、学习率、epoch/steps、采样参数与硬件')}${area('真实结果与观察','results',x.results)}${area('问题 / 失败 / 可能混杂因素','issues',x.issues)}${area('下一步行动','next',x.next)}${area('其他记录 / 权重路径 / 运行命令','notes',x.notes)}`))}
function viewExp(id){let x=state.experiments.find(x=>x.id===id);if(!x)return;openModal('实验详情 · '+x.name,`<div class="tag-list">${badge(x.status)}<span class="pill">${e(x.stage)}</span><span class="pill">${e(x.kind)}</span><span class="pill">${e(x.date)}</span></div><div class="kv"><div><small>编号</small><strong class="code">${e(x.id)}</strong></div><div><small>数据集版本</small><strong>${e(x.dataset||'未填')}</strong></div><div><small>随机种子</small><strong>${e(x.seed||'未填')}</strong></div><div><small>Git commit</small><strong class="code">${e(x.commit||'未填')}</strong></div></div>${[['研究假设',x.hypothesis],['配置 / JSON',x.config],['真实观察',x.results],['发现问题',x.issues],['下一步',x.next],['运行命令 / 权重',x.notes]].map(([title,v])=>`<hr class="divider"><div class="eyebrow">${title}</div><div class="summary-text">${nl(v||'未记录')}</div>`).join('')}<hr class="divider"><div class="card-actions">${button('编辑记录','edit-exp',`data-id="${e(x.id)}"`,'primary small')}${button('删除实验','delete-exp',`data-id="${e(x.id)}"`,'danger small')}</div>`)}
function editEval(id){let x=state.evaluations.find(x=>x.id===id)||{experiment:state.experiments[0]?.id||'',date:today(),protocol:'',split:'validation',count:'',psnr:'',ssim:'',lpips:'',success:'',notes:'',commit:''};if(!state.experiments.length){toast('先创建实验记录',true);return}openModal(id?'修改可信评测':'新增真实评测记录',wrapForm('eval',id,selectField('关联实验','experiment',state.experiments.map(x=>[x.id,x.id+' · '+x.name]),x.experiment)+field('日期','date',x.date,'type="date"')+field('协议名称 / 指标实现版本','protocol',x.protocol,'',true)+field('测试集划分 / 版本','split',x.split)+field('样本数','count',x.count,'type="number" min="0"')+field('PSNR ↑','psnr',x.psnr,'type="number" step="any"')+field('SSIM ↑','ssim',x.ssim,'type="number" step="any"')+field('LPIPS ↓','lpips',x.lpips,'type="number" step="any"')+field('条件遵循成功率 (%)','success',x.success,'type="number" step="any" min="0" max="100"')+field('代码提交','commit',x.commit)+area('评价口径、聚合方式、失败样本、人工审核','notes',x.notes)))}
function editReview(id){let x=state.reviews.find(x=>x.id===id)||{topic:'',category:'研究 · 理论',status:'待复核',evidence:'',notes:''};openModal(id?'复核知识卡':'创建知识卡',wrapForm('review',id,field('知识点 / 待回答问题','topic',x.topic,'required',true)+field('类别','category',x.category)+selectField('掌握状态','status',['待复核','正在验证','已掌握'],x.status)+area('数值 / 代码 / 推导证据','evidence',x.evidence)+area('理解、疑问和易错点','notes',x.notes)))}
function editSample(id){let exp=state.experiments.find(x=>x.id===filters.gallery.exp)||state.experiments[0];if(!exp){toast('请先创建实验',true);return}let x=exp.samples?.find(z=>z.id===id)||{prompt:'',seed:'',steps:'',cfg:'',notes:''};openModal(id?'编辑图像组':'为实验新建对比图像组',wrapForm('sample',id,selectField('所属实验','experiment',state.experiments.map(e=>[e.id,e.id+' · '+e.name]),exp.id)+area('提示词 / 图像 ID','prompt',x.prompt)+field('seed','seed',x.seed)+field('采样步数','steps',x.steps)+field('CFG scale','cfg',x.cfg)+area('样本说明、图像来源、模型权重','notes',x.notes)))}
function editSummary(){let s=filters.summaries.stage,x=state.summaries[s]||{};openModal('阶段总结 · '+s,wrapForm('summary',s,area('核心发现（注明可核对证据）','findings',x.findings||'')+area('局限性 / 反例 / 待解决问题','issues',x.issues||'')+area('下一阶段决策与待办','next',x.next||'')))}
function datasetHistory(id){let x=state.datasets.find(d=>d.id===id);if(!x)return;openModal('版本变更记录 · '+x.name,x.history?.length?x.history.slice().reverse().map(v=>`<div class="note" style="margin-bottom:13px"><strong>${e(v.updated)} · ${e(v.version)}</strong><br>样本量 ${e(v.size||'未填')} · 审核状态 ${e(v.status)}<br>${nl(v.notes||'未说明更改原因')}</div>`).join(''):empty('首次创建后，每次修改会保留上一版本的快照。'))}
function readForm(form){return Object.fromEntries(new FormData(form).entries())}
function saveRecord(form){const type=form.getAttribute('data-record'),id=form.getAttribute('data-id'), v=readForm(form);try{
 if(type==='task'){const newId=v.taskid.trim();if(state.tasks.some(x=>x.id===newId&&x.id!==id))throw Error('任务编号已存在');if(v.status==='已验证'&&!v.evidence.trim())throw Error('标记已验证前，必须填写验收证据。');const obj={id:newId,stage:v.stage,week:v.week,title:v.title,status:v.status,evidence:v.evidence,detail:v.detail,updated:today()};if(id)state.tasks[state.tasks.findIndex(x=>x.id===id)]=obj;else state.tasks.push(obj)}
 else if(type==='dataset'){let idx=state.datasets.findIndex(x=>x.id===id);const obj={...v,id:id||uid('ds'),size:v.size===''?'':Number(v.size),updated:today()};if(idx>=0){let old=state.datasets[idx];obj.history=[...(old.history||[]),{updated:old.updated,version:old.version,size:old.size,status:old.status,notes:old.notes,visual_quality:old.visual_quality,theme:old.theme,captions:old.captions,square:old.square}];state.datasets[idx]=obj}else{obj.history=[];state.datasets.push(obj)}}
 else if(type==='exp'){let idx=state.experiments.findIndex(x=>x.id===id);if(idx>=0)state.experiments[idx]={...state.experiments[idx],...v};else state.experiments.push({...v,id:uid('EXP'),curve:[],samples:[]})}
 else if(type==='eval'){let idx=state.evaluations.findIndex(x=>x.id===id),obj={...v,id:id||uid('ev')};if(idx>=0)state.evaluations[idx]=obj;else state.evaluations.push(obj)}
 else if(type==='review'){let idx=state.reviews.findIndex(x=>x.id===id),obj={...v,id:id||uid('k')};if(idx>=0)state.reviews[idx]=obj;else state.reviews.push(obj)}
 else if(type==='sample'){let oldExp=state.experiments.find(x=>x.samples?.some(z=>z.id===id));let newExp=state.experiments.find(x=>x.id===v.experiment);if(!newExp)throw Error('找不到所属实验');let obj={id:id||uid('sample'),prompt:v.prompt,seed:v.seed,steps:v.steps,cfg:v.cfg,notes:v.notes};if(oldExp){oldExp.samples=oldExp.samples.filter(z=>z.id!==id)}newExp.samples.push(obj);filters.gallery.exp=newExp.id;filters.gallery.sample=obj.id;view='gallery'}
 else if(type==='summary'){state.summaries[id]={findings:v.findings,issues:v.issues,next:v.next,updated:today()}}
 closeModal();persist('研究记录已更新');}catch(err){toast(err.message,true)}}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('当前浏览器不支持 IndexedDB'));const q=indexedDB.open(IDB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('media'))q.result.createObjectStore('media')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function mediaPut(key,blob){const db=await openDB();await new Promise((resolve,reject)=>{let tx=db.transaction('media','readwrite');tx.objectStore('media').put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function mediaGet(key){const db=await openDB();let blob=await new Promise((resolve,reject)=>{let q=db.transaction('media').objectStore('media').get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});db.close();return blob}
async function mediaDelete(key){const db=await openDB();await new Promise((resolve,reject)=>{let tx=db.transaction('media','readwrite');tx.objectStore('media').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function mediaClear(){const db=await openDB();await new Promise((resolve,reject)=>{let tx=db.transaction('media','readwrite');tx.objectStore('media').clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function mediaAll(){const db=await openDB();const tx=db.transaction('media'),st=tx.objectStore('media');let [keys,blobs]=await Promise.all([new Promise((r,j)=>{let q=st.getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}),new Promise((r,j)=>{let q=st.getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})]);db.close();return keys.map((key,i)=>({key,blob:blobs[i]}))}
function toDataURL(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function fromDataURL(u){let [head,b64]=u.split(',');let binary=atob(b64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream'})}
function download(filename,text,type='text/plain;charset=utf-8'){let file=new Blob([text],{type}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportJSON(){try{toast('正在打包图像与实验数据…');const media=(await mediaAll()).map(async m=>({key:m.key,data:await toDataURL(m.blob)}));let pack={app:'MiniGen Research Lab',format:1,exported_at:new Date().toISOString(),state,media:await Promise.all(media)};download('MiniGen_完整备份_'+today()+'.json',JSON.stringify(pack,null,2),'application/json');toast('完整 JSON 已导出，包含图像与曲线。')}catch(err){toast('备份失败：'+err.message,true)}}
async function importJSON(file){try{let data=JSON.parse(await file.text());if(data.app!=='MiniGen Research Lab'||!data.state||data.format!==1)throw Error('不是兼容的 MiniGen 备份格式');if(!confirm('导入将替换当前浏览器的全部 MiniGen 记录和图片，确定继续吗？'))return;let restored=data.state;if(!Array.isArray(restored.tasks)||!Array.isArray(restored.experiments)||!Array.isArray(restored.datasets))throw Error('备份内容不完整');await mediaClear();for(const m of data.media||[])await mediaPut(m.key,fromDataURL(m.data));state={...seed(),...restored,constraints:seed().constraints};save();closeModal();render();toast('备份已完整恢复。')}catch(err){toast('导入失败：'+err.message,true)}}
function stageMarkdown(s){let a=summaryStats(s),sum=state.summaries[s]||{};let lines=[`# MiniGen ${s}｜${STAGES[s]}｜阶段总结`,'',`生成日期：${today()}`,'',`- 任务已验证：${a.done.length}/${a.tasks.length}` ,`- 关联实验：${a.exps.length}`,`- 评测记录：${a.evals.length}`,'', '## 任务状态','',...a.tasks.map(t=>`- [${t.status==='已验证'?'x':' '}] ${t.id} ${t.title}｜${t.status}｜验收证据：${t.evidence}`),'','## 关键发现','',sum.findings||'（尚未记录）','','## 局限与问题','',sum.issues||'（尚未记录）','','## 下一步','',sum.next||'（尚未记录）','','## 实验索引','',...a.exps.map(x=>`- ${x.id}｜${x.name}｜${x.status}｜Git ${x.commit||'未记录'}｜${x.dataset||'数据集待补'}`),'','> 本报告由本地 MiniGen 面板生成，未提供的实验结果不会自动填充。'];return lines.join('\n')}
function extractCSV(text){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('CSV 至少需要表头与一行数据');function parseLine(x){let out=[],current='',quoted=false;for(let i=0;i<x.length;i++){let c=x[i];if(c==='"'){if(quoted&&x[i+1]==='"'){current+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){out.push(current.trim());current=''}else current+=c}out.push(current.trim());return out}let head=parseLine(lines[0]);if(!head.some(x=>['step','global_step','iteration','epoch'].includes(x.toLowerCase())))throw Error('CSV 必须有 step / global_step / iteration / epoch 列');let scol=head.findIndex(x=>['step','global_step','iteration','epoch'].includes(x.toLowerCase()));let points=[];for(let i=1;i<lines.length;i++){let cols=parseLine(lines[i]),step=Number(cols[scol]);if(!Number.isFinite(step))continue;let obj={step};head.forEach((k,j)=>{if(j!==scol&&cols[j]!==undefined&&cols[j]!==''){let val=Number(cols[j]);if(Number.isFinite(val))obj[k]=val}});if(Object.keys(obj).length>1)points.push(obj)}if(!points.length)throw Error('没有解析到数值型日志行');points.sort((a,b)=>a.step-b.step);let raw=points.length,max=4000;if(raw>max){let sampled=[];for(let i=0;i<max;i++)sampled.push(points[Math.round(i*(raw-1)/(max-1))]);points=sampled}return {points,raw}}
function drawCurve(){let x=state.experiments.find(z=>z.id===filters.curves.exp);let rows=(x?.curve||[]).filter(r=>Number.isFinite(Number(r.step))&&Number.isFinite(Number(r[filters.curves.metric])));let can=$('#curveCanvas');if(!can||!rows.length)return;let dpr=window.devicePixelRatio||1,w=can.clientWidth||600,h=can.clientHeight||325;can.width=Math.round(w*dpr);can.height=Math.round(h*dpr);let c=can.getContext('2d');c.scale(dpr,dpr);const m={l:68,r:22,t:25,b:49},cw=w-m.l-m.r,ch=h-m.t-m.b;let xs=rows.map(r=>Number(r.step)),ys=rows.map(r=>Number(r[filters.curves.metric]));let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);if(xmin===xmax)xmax=xmin+1;if(ymin===ymax){let delta=Math.max(Math.abs(ymin)*.1,.00001);ymin-=delta;ymax+=delta}let pad=(ymax-ymin)*.12;ymin-=pad;ymax+=pad;let xp=v=>m.l+(v-xmin)/(xmax-xmin)*cw,yp=v=>m.t+(1-(v-ymin)/(ymax-ymin))*ch;c.font='11px system-ui';c.textAlign='right';c.lineWidth=1;for(let i=0;i<=4;i++){let val=ymin+(ymax-ymin)*(1-i/4),yy=m.t+ch*i;c.strokeStyle='#2a4155';c.beginPath();c.moveTo(m.l,yy);c.lineTo(w-m.r,yy);c.stroke();c.fillStyle='#90aabe';c.fillText(Number(Math.abs(val)<.01?val.toExponential(1):val.toFixed(3)).toString(),m.l-11,yy+4)}c.textAlign='center';for(let i=0;i<=5;i++){let val=xmin+(xmax-xmin)*i/5;c.fillStyle='#90aabe';c.fillText(Math.round(val).toLocaleString('en-US'),m.l+cw*i,h-21)}c.fillStyle='#b7c9d8';c.fillText('训练 step',m.l+cw/2,h-3);c.strokeStyle='#5be0c1';c.lineWidth=2;c.lineJoin='round';c.beginPath();rows.forEach((r,i)=>{let px=xp(Number(r.step)),py=yp(Number(r[filters.curves.metric]));if(!i)c.moveTo(px,py);else c.lineTo(px,py)});c.stroke();let last=rows[rows.length-1];c.fillStyle='#6be1c8';c.beginPath();c.arc(xp(last.step),yp(last[filters.curves.metric]),4,0,Math.PI*2);c.fill()}
async function fillGallery(){let exp=state.experiments.find(x=>x.id===filters.gallery.exp),sample=exp?.samples?.find(x=>x.id===filters.gallery.sample);if(!sample)return;const media={};for(const k of ['original','recon','generated']){let blob;try{blob=await mediaGet(sample.id+':'+k)}catch(err){toast('图片读取失败：'+err.message,true);return}const node=$('#media_'+k);if(!node)return;if(blob){let url=URL.createObjectURL(blob);objectURLs.push(url);node.innerHTML=`<img alt="${k} 图" src="${url}">`;media[k]=url}}let st=$('#compareStage');if(st&&media.original&&media.recon){st.innerHTML=`<img src="${media.recon}" alt="VAE 重建图"><div class="compare-top" id="compareTop"><img src="${media.original}" alt="原图"></div><div class="compare-line" id="compareLine"></div>`;updateSlider($('#compareSlider')?.value||50)}}
function updateSlider(v){const layer=$('#compareTop'),line=$('#compareLine');if(layer)layer.style.clipPath=`inset(0 ${100-Number(v)}% 0 0)`;if(line)line.style.left=v+'%'}
function activate(viewName){view=viewName;render();window.scrollTo({top:0,behavior:'smooth'})}
function doAction(action,el){let id=el.dataset.id;switch(action){case 'goto':activate(el.dataset.target);break;
 case 'new-task':editTask();break;case 'edit-task':editTask(id);break;
 case 'new-dataset':editDataset();break;case 'edit-dataset':editDataset(id);break;case 'history-dataset':datasetHistory(id);break;
 case 'new-exp':editExp('','S3 CFG 基线');break;case 'edit-exp':closeModal();editExp(id);break;case 'view-exp':viewExp(id);break;
 case 'new-eval':editEval();break;case 'edit-eval':editEval(id);break;
 case 'new-review':editReview();break;case 'edit-review':editReview(id);break;
 case 'new-sample':editSample();break;case 'edit-sample':editSample(id);break;
 case 'edit-summary':editSummary();break;case 'export-md':download(`MiniGen_${filters.summaries.stage}_阶段总结.md`,stageMarkdown(filters.summaries.stage));toast('阶段 Markdown 已导出');break;
 case 'export':exportJSON();break;
 case 'csv-sample':download('minigen_train_csv_template.csv','step,loss,lr,grad_norm\n','text/csv');break;
 case 'delete-exp':{let x=state.experiments.find(y=>y.id===id);if(!x||!confirm(`删除实验 ${x.name} 及关联的评测和图像组？此操作不可撤销。`))break;Promise.all((x.samples||[]).flatMap(s=>['original','recon','generated'].map(k=>mediaDelete(s.id+':'+k).catch(()=>{})))).then(()=>{});state.experiments=state.experiments.filter(y=>y.id!==id);state.evaluations=state.evaluations.filter(y=>y.experiment!==id);closeModal();persist('实验及关联评测已删除');break}
 case 'delete-sample':{let x=state.experiments.find(z=>z.id===filters.gallery.exp);if(!x||!confirm('删除该组图像及三张已上传图片？'))break;x.samples=x.samples.filter(s=>s.id!==id);['original','recon','generated'].forEach(k=>mediaDelete(id+':'+k).catch(()=>{}));filters.gallery.sample='';persist('图像组已删除');break}
 case 'reset':if(confirm('确定清空当前全部记录和图片，重置为 MiniGen 初始模板？建议先导出 JSON 备份。')){mediaClear().catch(()=>{});state=seed();save();activate('dashboard');toast('已重置为初始模板')}break;
 case 'close-modal':closeModal();break;default:break;}}
document.addEventListener('click',ev=>{let nav=ev.target.closest('[data-view]');if(nav){ev.preventDefault();activate(nav.dataset.view);return}let act=ev.target.closest('[data-action]');if(act){ev.preventDefault();doAction(act.dataset.action,act);return}if(ev.target.classList.contains('modal-mask'))closeModal()});
document.addEventListener('submit',ev=>{if(ev.target.matches('.record-form')){ev.preventDefault();saveRecord(ev.target)}else if(ev.target.id==='settingsForm'){ev.preventDefault();state.settings={...state.settings,...readForm(ev.target)};persist('项目设置已保存')}});
document.addEventListener('change',async ev=>{let t=ev.target;let filterMap={taskStage:['tasks','stage'],taskStatus:['tasks','status'],datasetStatus:['datasets','status'],expStage:['experiments','stage'],reviewStatus:['reviews','status'],curveExp:['curves','exp'],curveMetric:['curves','metric'],galleryExp:['gallery','exp'],gallerySample:['gallery','sample'],summaryStage:['summaries','stage']};if(filterMap[t.id]){let [scope,key]=filterMap[t.id];filters[scope][key]=t.value;if(t.id==='galleryExp')filters.gallery.sample='';if(t.id==='curveExp')filters.curves.metric='';render();return}
 if(t.name==='template'&&t.value){let template=EXP_TEMPLATES[t.value];if(template){let form=t.closest('form');form.elements.kind.value=template.kind;form.elements.hypothesis.value=template.hypothesis;form.elements.config.value=JSON.stringify(template.config,null,2);form.elements.next.value=template.next;if(!form.elements.name.value.trim())form.elements.name.value=t.value+' · '+today()}return}
 if(t.id==='csvInput'&&t.files[0]){try{let exp=state.experiments.find(x=>x.id===filters.curves.exp),{points,raw}=extractCSV(await t.files[0].text());if(!exp)throw Error('当前没有关联实验');if(exp.curve?.length&&!confirm('将用新 CSV 覆盖该实验已保存的曲线，继续吗？'))return;exp.curve=points;exp.curveRawCount=raw;persist(`已读取 ${raw} 条 CSV 日志，保存 ${points.length} 个绘图点`)}catch(err){toast('CSV 导入失败：'+err.message,true)}return}
 if(t.id==='importJSON'&&t.files[0]){await importJSON(t.files[0]);return}
 if(t.matches('[data-image-upload]')&&t.files[0]){try{let file=t.files[0];if(!file.type.startsWith('image/'))throw Error('请选择图片文件');if(file.size>30*1024*1024)throw Error('单张图片不应超过 30MB');await mediaPut(t.dataset.sample+':'+t.dataset.imageUpload,file);render();toast('图像已保存到本地 IndexedDB')}catch(err){toast(err.message,true)}return}
});
document.addEventListener('input',ev=>{if(ev.target.id==='compareSlider')updateSlider(ev.target.value)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});window.addEventListener('resize',()=>{if(view==='curves')drawCurve()});
render();
})();
</script></body></html>
