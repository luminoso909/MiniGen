<!doctype html><html lang="zh"><meta charset="utf-8"><title>MiniGen 匿名审核</title>
<style>body{font:16px system-ui;margin:24px;max-width:1100px}article{border:1px solid #aaa;padding:16px;margin:20px 0}img{width:256px;image-rendering:auto;cursor:zoom-in}img:active{width:768px;max-width:100%}label{display:inline-block;margin:8px}textarea{width:95%;height:60px}.question{display:block}header{position:sticky;top:0;background:white;padding:12px;border-bottom:1px solid #999}</style>
<header><h1>匿名图像审核</h1><p>图片可能为真实、生成或人为退化材料。不要猜测模型。按住图片可放大。评分 1=很差，5=很好；无法判断请留空或选不可判断。</p><label>审核人 <input id="reviewer"></label><button id="save">导出审核 JSON</button><label>恢复审核 <input id="restore" type="file" accept="application/json"></label><span id="progress"></span></header><main id="items"></main>
<script>const DATA=__DATA__;const key='minigen-review-'+DATA.package_id;let saved=JSON.parse(localStorage.getItem(key)||'{}');let state=saved.package_id===DATA.package_id?saved:{schema:'minigen.human-answers.v1',package_id:DATA.package_id,reviewer:'',answers:{}};
function store(){localStorage.setItem(key,JSON.stringify(state));document.getElementById('progress').textContent=Object.keys(state.answers).length+'/'+DATA.items.length+' 已记录';}
function select(options,value,change){let e=document.createElement('select');for(const [v,t] of options){let o=document.createElement('option');o.value=v;o.textContent=t;e.append(o);}e.value=value??'';e.onchange=()=>change(e.value);return e;}
function render(){const main=document.getElementById('items');main.textContent='';document.getElementById('reviewer').value=state.reviewer||'';for(const item of DATA.items){const card=document.createElement('article');const title=document.createElement('p');title.textContent='匿名 ID: '+item.item_id+' | '+item.caption;card.append(title);if(item.image){const img=document.createElement('img');img.src=item.image;img.alt='匿名审核图';card.append(img);}else{const failed=document.createElement('p');failed.textContent='生成失败或图片不可读取；本项仍计入审核，不应跳过。';card.append(failed);}const get=()=>state.answers[item.item_id]??={quality:null,alignment:null,errors:[],notes:'',questions:{}};const current=state.answers[item.item_id]||{};for(const [field,name] of [['quality','生成质量'],['alignment','文本遵循']]){const label=document.createElement('label');label.textContent=name;label.append(select([['','未评分'],...[1,2,3,4,5].map(x=>[String(x),String(x)])],current[field],v=>{get()[field]=v?Number(v):null;store();}));card.append(label);}for(const q of item.questions){const label=document.createElement('label');label.className='question';label.textContent='是否满足 '+q.text;label.append(select([['','未判断'],['correct','满足'],['incorrect','不满足'],['undecidable','不可判断']],current.questions?.[q.question_id],v=>{get().questions[q.question_id]=v;store();}));card.append(label);}const errors=document.createElement('div');for(const kind of DATA.error_types){const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=(current.errors||[]).includes(kind);check.onchange=()=>{get().errors=[...new Set(check.checked?[...get().errors,kind]:get().errors.filter(x=>x!==kind))];store();};label.append(check,kind);errors.append(label);}card.append(errors);const notes=document.createElement('textarea');notes.placeholder='具体失真位置或不能判断的原因';notes.value=current.notes||'';notes.oninput=()=>{get().notes=notes.value;store();};card.append(notes);main.append(card);}store();}
document.getElementById('reviewer').oninput=e=>{state.reviewer=e.target.value;store();};document.getElementById('save').onclick=()=>{state.reviewed_at=new Date().toISOString();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='human_answers.json';a.click();URL.revokeObjectURL(a.href);};document.getElementById('restore').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.package_id!==DATA.package_id||!data.answers)throw Error('审核包不匹配');state=data;render();}catch(error){alert(error.message);}};render();</script></html>
