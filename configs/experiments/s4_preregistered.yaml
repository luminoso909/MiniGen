schema_version: 1
registered_on: '2026-11-05'
status: planned_not_executed
question: compare_two_complete_recipes_under_matched_data_model_and_compute
prerequisites:
  - accepted_personal_DiT_and_CFG
  - repeatable_conditional_generation_gain
  - accepted_parser_with_human_review
  - frozen_train_validation_text_and_latent_cache
recipes:
  diffusion: {prediction: epsilon, training_time: uniform_discrete_0_999, sampler: ddim_eta0}
  flow: {prediction: velocity, path: independent_endpoint_linear_noise_to_data, training_time: uniform_0_1, sampler: euler}
training:
  seeds: [0, 1]
  backbone: same_conditional_DiT_frozen_after_S3
  text_encoder: same_CLIP_and_segmentation
  condition_dropout: 0.1
  effective_batch: same_for_all_four_runs
  optimizer: AdamW_same_hyperparameters
  ema: same_for_all_four_runs
  target_updates: 8000
  pilot_updates: 200
  common_reduced_updates_if_budget_exceeded: true
  compare: [same_updates, cumulative_GPU_seconds]
  save_intermediate_checkpoints: true
sampling:
  cfg_candidates_validation: [1, 3, 5]
  cfg_convention: unconditioned_plus_scale_times_difference
  primary_per_image_branch_equivalent_nfe: [10, 20, 40]
  cfg_1_update_counts: [10, 20, 40]
  cfg_above_1_update_counts: [5, 10, 20]
  secondary_matched_updates: [10, 20, 40]
  report: [model_calls, branch_examples, effective_nfe, latency, throughput, peak_memory_if_supported]
  paired_initial_noise: true
  warmup_and_device_synchronize: true
metrics:
  primary: all_requested_attributes_per_image
  secondary: [count, color_multiset, shape_multiset, binding, relation, parse_failure]
  splits: [validation, test_id, test_combo, test_template]
  confidence_intervals: paired_sample_bootstrap_not_substitute_for_training_repeats
  loss_magnitude_cross_recipe_comparison: forbidden
budget:
  total_cloud_cny_limit: [100, 300]
  current_quote: not_measured
  pilot_required_before_paid_run: true
  cost: GPU_hours_times_actual_price_plus_evaluation_storage_transfer
  reduction_order: [optional_sampler_search, extra_visuals_metrics, common_training_updates, B_line_steps]
conclusion_limits:
  - independent_coupling_is_not_global_optimal_transport
  - compare_paths_time_objectives_and_solvers_as_recipes_not_only_loss
  - no_prior_assumption_flow_wins
